<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario CSS3</title>

    <style>
        body{background: radial-gradient(rgb(139, 139, 139), rgb(31, 30, 30)); background-attachment: fixed;}
        .formulario{border: 2px solid rgb(255, 236, 150); display: flex; justify-content: center; height: fit-content; align-items: center; 
                    width: fit-content; padding: 20px; margin: 0 auto; margin-top: 300px; background-color: rgb(204, 183, 156);}
        .two-columns{display: flex;}
        .fields{display: flex; flex-flow: column wrap; margin: 6px;}
        .btn{margin-left: 43%;}
        #coment{height: 100px;}
        input, textarea{background: none; border: none; outline: none; border-bottom: 2px solid white; color: white; transition: 0.5s ease;}
        label{font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif; font-size: large; color: white;}
        button{background: rgb(83, 83, 230); color: white; border: none; margin-top: 10px; transition: 0.3s ease;}
        textarea:hover{border-bottom: 3px solid yellow; transform: scale(1.1);}
        input:hover{border-bottom: 3px solid yellow; transform: scale(1.1);}
        button:hover{background-color: red; transform: scale(1.1);}
    </style>

</head>
<body>
    <div class="formulario">
    <form>
		<div class="two-columns">
			<div class="fields">
				<label for="name">Nombre</label>
				<input id="name" type="text" name="name" autocomplete="off"> 	
			</div>
			
			<div class="fields">
				<label for="lastname">Apellido</label>
				<input id="lastname" type="text" name="lastname" autocomplete="off">	
			</div>
		</div>

		<div class="two-columns">
			<div class="fields">
				<label for="tel">Telefono</label>
				<input id="tel" type="text" name="tel" autocomplete="off">
			</div>

			<div class="fields">
				<label for="email">Correo</label>
				<input id="email" type="email" name="email" autocomplete="off">	
			</div>
		</div>
		

		<div class="fields">
			<label for="coment">Comentarios</label>
			<textarea id="coment"></textarea>
		</div>

		<div class="btn">
			<button>Enviar</button>	
		</div>
	</form>
    </div>

</body>
</html>
